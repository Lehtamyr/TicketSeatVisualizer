name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
      - '.gitignore'
      - '.dockerignore'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
      - '.gitignore'
      - '.dockerignore'
      - 'LICENSE'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: Quality Gate (Lint, Typecheck, Unit Tests)
  # ─────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ticketing_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ticketing_test_db
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate

      - name: Push Database Schema & Seed Test Data
        run: |
          npx prisma db push
          npm run db:seed

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Database & Full Playwright E2E Integration
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E Suite
    needs: code-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ticketing_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ticketing_test_db
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Push Database Schema & Seed Test Data
        run: |
          npx prisma db push
          npm run db:seed

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Stage 3: Multi-Stage Docker Image Build
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Build Production Docker Image
    needs: [code-quality, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Stage 4: Deploy to Vercel (Only runs if ALL tests pass)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    needs: [code-quality, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Vercel Production Deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "All tests passed! Triggering Vercel deployment..."
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel via Deploy Hook URL..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
            HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
            HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

            echo "=== Vercel API Response ==="
            echo "$HTTP_BODY"
            echo "HTTP Status Code: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "❌ Vercel Deploy Hook failed with HTTP status $HTTP_STATUS"
              exit 1
            fi
            echo "✅ Vercel deployment successfully triggered!"
          elif [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying via Vercel CLI token..."
            npx vercel --prod --token "$VERCEL_TOKEN" --yes
          else
            echo "❌ Error: Neither VERCEL_DEPLOY_HOOK nor VERCEL_TOKEN secret is configured in GitHub Secrets."
            exit 1
          fi
